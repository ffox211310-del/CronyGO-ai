<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:where(html) {
  font-family: "Inter", system-ui, -apple-system, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "JetBrains Mono", ui-monospace, monospace;
}
</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CronyGO</title>

  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0a">
  
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  { "imports": { "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm@0.2.79" } }
  </script>
</head>
<body>
<header>
  <div class="header-left">
    <h1>CronyGO/v.0.6</h1>
    <select id="model-select">
      <option value="0.5B">0.5B 軽量</option>
      <option value="1.5B">1.5B 標準</option>
      <option value="3B">3B 少し重い</option>
      <option value="7B" selected>7B 高性能</option>
      <option value="14B">14B PC最大</option>
    </select>
  </div>
  <div class="header-right">
    <button id="download-btn">ダウンロード</button>
    <div id="status">未DL</div>
  </div>
</header>
  
  <div id="progress-wrap"><div id="progress-bar"></div></div>

  <div id="chat">
    <div class="msg assistant">こんにちは！初回はモデルをダウンロードします。2回目からはオフラインで動きます。WebGPU対応ブラウザが必要です。</div>

    <div id="loading-view">
      <img id="loading-icon-dark" class="loading-icon" src="./assets/CronyGOicon.jpg" alt="CronyGO dark" />
      <img id="loading-icon-light" class="loading-icon" src="./assets/CronyGOicon_Light.jpg" alt="CronyGO light" />
      <div id="loading-text">準備中...</div>
    </div>
  </div>

<div id="voice-preview" style="font-size:11px;color:#888;text-align:center;padding:2px 12px;min-height:14px"></div>

  
  <div class="hint">エンジン: WebLLM CreateMLCEngine / 個別DL方式 / iPhoneはメモリ制限注意</div>

  <div id="composer">
    <button id="settings-btn" aria-label="設定">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
<input id="input" type="text" placeholder="モデルをダウンロードしてください" autocomplete="off" disabled />
    
    <button id="mic-btn" aria-label="マイク" title="マイク">●</button>
    
    <button id="send" disabled aria-label="送信">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m22 2-7 20-4-9-9-4Z"></path>
        <path d="M22 2 11 13"></path>
      </svg>
    </button>
  </div>

  <div id="settings-overlay"></div>
  <div id="settings-panel">
    <div class="settings-header">
      <h2>設定</h2>
      <button id="settings-close" aria-label="閉じる">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <label class="settings-label">システムプロンプト</label>
        <textarea id="system-prompt-input" placeholder="あなたはCronyGOです。日本語で簡素に答えてください。"></textarea>
        <div class="settings-row">
          <button id="save-prompt-btn" class="primary-btn">保存</button>
          <button id="reset-prompt-btn" class="secondary-btn">デフォルトに戻す</button>
        </div>
        <div id="prompt-status" class="settings-desc"></div>
      </div>
      <div class="settings-section">
        <label class="settings-label">テーマ</label>
        <div class="theme-options">
          <button class="theme-opt" data-theme="dark">ダーク (黒)</button>
          <button class="theme-opt" data-theme="light">ライト (e5e5e5)</button>
        </div>
        <div class="settings-desc">差し色 #4FD1C5 は共通。アイコンも自動切替</div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>

</html>
