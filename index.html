<!DOCTYPE html>
<html lang="ja">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0a">
<title>CronyGO v0.1α</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{ "imports": { "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm@0.2.79" } }
</script>
</head>
<body>

<div id="room-overlay"></div>
<div id="room-drawer">
  <div class="drawer-header">
    <span>ルーム</span>
    <button id="room-close" class="icon-btn">×</button>
  </div>
  <button id="new-room-btn" class="secondary-btn">+ 新しいチャット</button>
  <div id="room-list"></div>
</div>

<header>
  <div class="header-left">
    <button id="home-btn" aria-label="ホーム" title="ホーム">🏠</button>
    <button id="menu-btn" aria-label="ルーム一覧" title="ルーム一覧">💬</button>
  </div>
  <div class="header-center">
    <select id="mode-select" aria-label="防災モード選択">
      <option value="normal">通常相談</option>
      <option value="prepare">避難準備</option>
      <option value="shelter">避難所・経路</option>
      <option value="stock">備蓄リスト</option>
      <option value="emergency">緊急対応</option>
      <option value="safety">安否確認</option>
    </select>
  </div>
  <div class="header-right">
    <button id="settings-btn" aria-label="設定">⚙</button>
  </div>
</header>

<div id="progress-wrap"><div id="progress-bar"></div></div>

<div id="chat">
  <div id="loading-view">
    <img id="loading-icon" class="loading-icon" src="./assets/CronyGOicon.jpg" alt="CronyGO" />
    <div id="loading-text">準備中...</div>
  </div>
</div>

<div id="voice-preview"></div>
<div class="hint">防災に関する情報は自治体の最新情報もご確認ください</div>

<div id="composer">
  <div class="composer-inner">
    <button id="mic-btn" aria-label="マイク">●</button>
    <input id="input" type="text" placeholder="メッセージを入力..." autocomplete="off" disabled />
    <button id="send" disabled aria-label="送信">➤</button>
  </div>
</div>

<div id="settings-overlay"></div>
<div id="settings-panel">
  <div class="settings-header">
    <h2>CronyGO 設定</h2>
    <button id="settings-close">×</button>
  </div>
  <div class="settings-body">
    <div class="settings-group open">
      <button class="settings-group-btn"><span>防災モード</span><span class="arrow">›</span></button>
      <div class="settings-group-content">
        <div class="settings-desc">上部中央でモードを切り替えできます。現在はUIのみ実装、v0.2でプロンプト連携予定です。</div>
      </div>
    </div>
    <div class="settings-group">
      <button class="settings-group-btn"><span>システム</span><span class="arrow">›</span></button>
      <div class="settings-group-content">
        <div class="settings-section">
          <label class="settings-label">システムプロンプト</label>
          <textarea id="system-prompt-input"></textarea>
          <div class="settings-row">
            <button id="save-prompt-btn" class="primary-btn">保存</button>
            <button id="reset-prompt-btn" class="secondary-btn">リセット</button>
          </div>
          <div id="prompt-status" class="settings-desc"></div>
        </div>
        <div class="settings-section">
          <label class="settings-label">生成パラメータ</label>
          <div class="param-row"><span>Temperature</span><span id="temp-value">0.7</span></div>
          <input type="range" id="temp-slider" min="0" max="2" step="0.1" value="0.7">
          <div class="param-row" style="margin-top:12px;"><span>Max Tokens</span></div>
          <input type="number" id="max-tokens-input" min="128" max="4096" step="128" value="1024">
        </div>
      </div>
    </div>
    <div class="settings-group">
      <button class="settings-group-btn"><span>カスタム</span><span class="arrow">›</span></button>
      <div class="settings-group-content">
        <div class="settings-section">
          <label class="settings-label">テーマ</label>
          <div class="theme-options">
            <button class="theme-opt" data-theme="dark">ダーク</button>
            <button class="theme-opt" data-theme="light">ライト</button>
          </div>
        </div>
        <div class="settings-section">
          <label class="settings-label">読み上げ音声</label>
          <select id="tts-voice-select"></select>
          <div class="settings-row" style="margin-top:8px;">
            <button id="tts-test-btn" class="secondary-btn">試聴</button>
            <button id="tts-reload-voices-btn" class="secondary-btn">再読込</button>
          </div>
        </div>
        <div class="settings-section">
          <label class="settings-label">チャット背景</label>
          <input type="file" id="bg-upload" accept="image/*" style="display:none">
          <div class="settings-row">
            <button id="bg-upload-btn" class="secondary-btn">写真を選ぶ</button>
            <button id="bg-clear-btn" class="secondary-btn">消す</button>
          </div>
        </div>
      </div>
    </div>
    <div class="settings-group">
      <button class="settings-group-btn"><span>詳細情報</span><span class="arrow">›</span></button>
      <div class="settings-group-content">
        <div class="settings-section">
          <label class="settings-label">モデル情報 (非表示領域)</label>
          <div class="settings-desc" style="line-height:1.6;">
            Engine: WebLLM 0.2.79 固定<br>
            Model: Gemma-2-2B-JPN-IT q4f16_1-MLC<br>
            v0.1α - 防災AI<br>
            <span id="cache-usage">使用量: 計算中...</span><br>
            <span id="cache-model-name">Gemma2B-JPN</span>
          </div>
          <div class="settings-row" style="margin-top:8px;">
            <button id="cache-clear-btn" class="secondary-btn" style="color:#ff6b6b;">キャッシュ削除</button>
            <button id="cache-refresh-btn" class="secondary-btn">更新</button>
            <button id="force-dl-btn" class="secondary-btn">再DL</button>
          </div>
          <div id="dl-status" class="settings-desc" style="margin-top:8px;"></div>
        </div>
        <div class="settings-section">
          <div class="settings-row" style="justify-content:space-between;">
            <span style="font-size:12px;">開発者コンソール</span>
            <label style="position:relative; width:44px; height:24px;">
              <input type="checkbox" id="dev-console-toggle" style="opacity:0; width:0; height:0;">
              <span id="dev-toggle-bg" style="position:absolute; inset:0; background:#333; border-radius:24px;"></span>
              <span id="dev-toggle-dot" style="position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s;"></span>
            </label>
          </div>
          <span style="font-size:11px; opacity:0.6;">状態: <span id="dev-console-label">OFF</span></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</html>
