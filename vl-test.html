<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wllama VL standalone test</title>
<style>
  body { font-family: sans-serif; margin: 16px; background: #111; color: #eee; }
  button { font-size: 16px; padding: 10px 14px; margin: 4px 4px 4px 0; }
  button:disabled { opacity: .4; }
  #log { white-space: pre-wrap; word-break: break-all; background: #000; border: 1px solid #444; padding: 10px; font-size: 12px; min-height: 300px; }
  canvas { display: none; }
</style>
</head>
<body>
<h3>wllama 3.8.1 VL standalone test（CronyGO抜き）</h3>
<div>
  <button id="btn-load">1. モデルをロード</button>
  <button id="btn-text" disabled>2. テキストのみ送信</button>
  <button id="btn-img-stream" disabled>3. 画像つき送信（stream）</button>
  <button id="btn-img-nostream" disabled>4. 画像つき送信（non-stream）</button>
  <button id="btn-all">全部まとめて実行</button>
</div>
<canvas id="cv" width="800" height="600"></canvas>
<pre id="log"></pre>

<script type="module">
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/index.js";

const WASM_URL = "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/wasm/wllama.wasm";
const MODEL_URL = "https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/LFM2.5-VL-450M-Q4_0.gguf";
const MMPROJ_URL = "https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/mmproj-LFM2.5-VL-450m-Q8_0.gguf";

const logEl = document.getElementById("log");
const t0 = performance.now();
function log(...args) {
  const line = `[${((performance.now() - t0) / 1000).toFixed(1)}s] ` + args.map(a => typeof a === "string" ? a : JSON.stringify(a)).join(" ");
  logEl.textContent += line + "\n";
  console.log(line);
}
window.addEventListener("error", e => log("WINDOW ERROR:", e.message));
window.addEventListener("unhandledrejection", e => log("UNHANDLED REJECTION:", e.reason?.name || "", e.reason?.message || String(e.reason)));

log("crossOriginIsolated =", self.crossOriginIsolated, "/ hardwareConcurrency =", navigator.hardwareConcurrency);

// テスト画像を canvas で生成（赤丸・青四角・7392・緑三角）
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
ctx.fillStyle = "white"; ctx.fillRect(0, 0, 800, 600);
ctx.fillStyle = "rgb(220,40,40)"; ctx.beginPath(); ctx.arc(120, 120, 80, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = "rgb(40,80,220)"; ctx.fillRect(600, 40, 160, 160);
ctx.fillStyle = "rgb(40,170,70)"; ctx.beginPath(); ctx.moveTo(400, 420); ctx.lineTo(300, 560); ctx.lineTo(500, 560); ctx.closePath(); ctx.fill();
ctx.fillStyle = "black"; ctx.font = "bold 150px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
ctx.fillText("7392", 400, 300);
ctx.font = "bold 36px sans-serif"; ctx.textAlign = "left";
ctx.fillText("CronyGO TEST", 40, 570);
const imgBlob = await new Promise(r => cv.toBlob(r, "image/png"));
const imgBuf = await imgBlob.arrayBuffer();
log("test image ready:", imgBuf.byteLength, "bytes (PNG)");

const wllama = new Wllama({ default: WASM_URL });
let loaded = false;

async function loadModel() {
  if (loaded) return;
  log("loadModelFromUrl start (CronyGOと同じパラメータ)");
  let lastPct = -25;
  await wllama.loadModelFromUrl({ url: MODEL_URL, mmprojUrl: MMPROJ_URL }, {
    n_ctx: 4096,
    n_gpu_layers: 0,
    reasoning_format: "deepseek",
    reasoning_budget_tokens: 2048,
    progressCallback: ({ loaded: l, total }) => {
      if (!total) return;
      const pct = Math.round((l / total) * 100);
      if (pct >= lastPct + 25) { lastPct = pct; log("download", pct + "%"); }
    }
  });
  loaded = true;
  log("load done");
  try { log("supportInputModality('image') =", wllama.supportInputModality("image")); } catch (e) { log("supportInputModality error:", e.message); }
  document.getElementById("btn-text").disabled = false;
  document.getElementById("btn-img-stream").disabled = false;
  document.getElementById("btn-img-nostream").disabled = false;
}

async function runStream(label, messages) {
  log(`--- ${label} start`);
  const start = performance.now();
  let first = true, chars = 0, out = "";
  try {
    const ac = new AbortController();
    const stream = await wllama.createChatCompletion({
      messages, max_tokens: 512, temperature: 0.7, repeat_penalty: 1.1,
      top_p: 0.9, top_k: 40, stream: true, abortSignal: ac.signal,
    });
    log(`${label}: stream object returned (${((performance.now() - start) / 1000).toFixed(1)}s)`);
    for await (const chunk of stream) {
      const d = chunk?.choices?.[0]?.delta || {};
      const t = (d.content || "") + (d.reasoning_content || "");
      if (t) {
        if (first) { first = false; log(`${label}: FIRST TOKEN (${((performance.now() - start) / 1000).toFixed(1)}s)`); }
        chars += t.length; out += t;
      }
    }
    log(`${label}: DONE (${((performance.now() - start) / 1000).toFixed(1)}s) chars=${chars}`);
    log(`${label}: output =`, out.slice(0, 500));
  } catch (e) {
    log(`${label}: ERROR (${((performance.now() - start) / 1000).toFixed(1)}s)`, e?.name || "", e?.message || String(e));
  }
}

async function runNoStream(label, messages) {
  log(`--- ${label} start`);
  const start = performance.now();
  try {
    const res = await wllama.createChatCompletion({
      messages, max_tokens: 512, temperature: 0.7, repeat_penalty: 1.1,
      top_p: 0.9, top_k: 40, stream: false,
    });
    log(`${label}: DONE (${((performance.now() - start) / 1000).toFixed(1)}s)`);
    log(`${label}: result =`, JSON.stringify(res).slice(0, 800));
  } catch (e) {
    log(`${label}: ERROR (${((performance.now() - start) / 1000).toFixed(1)}s)`, e?.name || "", e?.message || String(e));
  }
}

const textMsgs = [{ role: "user", content: "1+1は？" }];
const imgMsgs = [{ role: "user", content: [
  { type: "text", text: "何が写ってる？" },
  { type: "image", data: imgBuf },
]}];

document.getElementById("btn-load").addEventListener("click", () => loadModel().catch(e => log("LOAD ERROR:", e?.message || String(e))));
document.getElementById("btn-text").addEventListener("click", () => runStream("TEXT", textMsgs));
document.getElementById("btn-img-stream").addEventListener("click", () => runStream("IMAGE-STREAM", imgMsgs));
document.getElementById("btn-img-nostream").addEventListener("click", () => runNoStream("IMAGE-NOSTREAM", imgMsgs));
document.getElementById("btn-all").addEventListener("click", async () => {
  try {
    await loadModel();
    await runStream("TEXT", textMsgs);
    await runStream("IMAGE-STREAM", imgMsgs);
    await runNoStream("IMAGE-NOSTREAM", imgMsgs);
    log("=== ALL DONE ===");
  } catch (e) { log("ALL ERROR:", e?.message || String(e)); }
});
log("ready. 「全部まとめて実行」で開始");
</script>
</body>
</html>
